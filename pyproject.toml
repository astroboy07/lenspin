[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lenspin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "bilby",
    "dynesty",
    "lalsuite",
    "matplotlib",
    "mpmath",
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
